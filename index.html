<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Sized icons rather than the 1060x929 source: browsers squash a
         non-square favicon, and the source is ~590kB on every page load. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/branding/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/images/branding/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/branding/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mpho Madi Trust Fund supports children born without limbs with mobility devices, dignity-centered care, and family guidance." />
    <title>Mpho Madi Trust Fund</title>
    <!-- Inline, so it applies before the stylesheet arrives: the first frame a
         visitor sees must be white. The arrival overlay paints over an empty
         #root on a first visit, and a white document means a slow bundle or a
         slow image can never flash a dark or unstyled screen first. -->
    <style>
      html,
      body {
        background: #ffffff;
      }
    </style>
    <!-- Preloads belong to the arrival animation, and only on a page load that can
         actually play it: the first of a browser session. Later page views
         preload nothing, so nobody downloads animation assets they will not
         see (and Chrome has no unused preload to warn about). This only reads
         the flag - SiteWelcome still decides and claims it. Nothing waits on
         these: if an asset is slow or missing the sequence still runs to time
         and still ends.

         Order matters on slow connections. The JavaScript bundle starts the
         whole page, so the heart (needed in the first second) goes alongside
         it, and the ~370kB horizontal logo (needed ~6s in) is requested only
         once the heart has landed. Preloading all three at once made the
         bundle share bandwidth with the logo: the overlay started 1.4s later
         at 1.6Mbps and 3.7s later at 700kbps. Reduced-motion visitors never
         see the heart, so they preload only the logo they are shown at once. -->
    <script>
      try {
        if (!sessionStorage.getItem('mm.site.arrival')) {
          var mmPreload = function (href) {
            var link = document.createElement('link')
            link.rel = 'preload'
            link.as = 'image'
            link.href = href
            document.head.appendChild(link)
            return link
          }
          var mmLogo = '/images/branding/mpho-madi-logo-horizontal.png'
          var mmReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
          if (mmReduced) {
            mmPreload(mmLogo)
          } else {
            var mmHeart = mmPreload('/images/branding/mpho-madi-heart.png')
            var mmThen = function () {
              mmPreload(mmLogo)
            }
            mmHeart.onload = mmThen
            mmHeart.onerror = mmThen
          }
        }
      } catch (e) {
        /* Storage unavailable: skip the hints, the images still load normally. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
